name: Sync Upstream, Patch and Release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-patch-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Custom Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Home Assistant Core (Master stable branch)
        run: |
          git clone --depth 1 -b master https://github.com/home-assistant/core.git ha-core

      - name: Sync homekit_controller folder
        run: |
          rm -rf custom_components/homekit_controller
          mkdir -p custom_components
          cp -r ha-core/homeassistant/components/homekit_controller custom_components/
          rm -rf ha-core

      - name: Apply Vimar Patch dynamically (Python)
        run: python3 scripts/apply_vimar_patch.py

      - name: Check for real changes (ignore date-only version bump)
        id: check
        run: |
          # Allinea version e codeowners a quanto già committato in HEAD, così il
          # confronto rileva SOLO modifiche reali di homekit_controller/della patch,
          # non la data che cambierebbe comunque ogni giorno.
          OLD_VERSION=$(git show HEAD:custom_components/homekit_controller/manifest.json 2>/dev/null | jq -r '.version // empty')
          jq --arg ver "$OLD_VERSION" '. + {version: $ver, codeowners: ["@itsjustdeepred"]}' custom_components/homekit_controller/manifest.json > tmp.json
          mv tmp.json custom_components/homekit_controller/manifest.json

          git add custom_components/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nessuna modifica sostanziale rilevata dall'upstream."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Inject today's Version into manifest.json
        if: steps.check.outputs.changed == 'true'
        run: |
          VERSION=$(date +%Y.%m.%d)
          jq --arg ver "$VERSION" '.version = $ver' custom_components/homekit_controller/manifest.json > tmp.json
          mv tmp.json custom_components/homekit_controller/manifest.json
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Process Commit and GitHub Release
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add custom_components/
          git commit -m "Sync upstream, update codeowners and apply Vimar dimmer fix (${{ env.VERSION }})"
          git push origin main

          git tag ${{ env.VERSION }}
          git push origin ${{ env.VERSION }}

          gh release create ${{ env.VERSION }} \
            --title "Release ${{ env.VERSION }}" \
            --notes "Automatic bump to ${{ env.VERSION }}"
